name: Validate CABO
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cabo
          POSTGRES_PASSWORD: cabo
          POSTGRES_DB: cabo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cabo:cabo@localhost:5432/cabo_test
      DIRECT_DATABASE_URL: postgresql://cabo:cabo@localhost:5432/cabo_test
      TEST_DATABASE_URL: postgresql://cabo:cabo@localhost:5432/cabo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run test:release
      - run: npm test
      - run: npm run build
      - run: docker build -t cabo-server .
      - run: npm run export -w @cabo/mobile
      - run: npm audit --audit-level=high
